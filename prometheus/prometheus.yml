global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    environment: lab

rule_files:
  - rules/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: alertmanager
    static_configs:
      - targets: ["alertmanager:9093"]

  # Targets come from files in targets/. Add or remove hosts by editing those
  # files; Prometheus notices the change without a restart or reload.
  - job_name: node
    file_sd_configs:
      - files: [targets/node/*.yml]
        refresh_interval: 30s

  - job_name: windows
    file_sd_configs:
      - files: [targets/windows/*.yml]
        refresh_interval: 30s

  # The exporter's own health. Probe jobs below only say if the TARGET answered.
  - job_name: blackbox-exporter
    static_configs:
      - targets: ["blackbox-exporter:9115"]
       

  - job_name: blackbox-http
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets:
          - http://prometheus:9090/-/healthy
          - http://alertmanager:9093/-/healthy
          - http://grafana:3000/api/health
        labels:
          site: lab
    relabel_configs: &blackbox_relabel
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115

  - job_name: blackbox-icmp
    metrics_path: /probe
    params:
      module: [icmp]
    file_sd_configs:
      - files: [targets/icmp/*.yml]
        refresh_interval: 30s
    relabel_configs: *blackbox_relabel

  - job_name: blackbox-tls
    metrics_path: /probe
    params:
      module: [https_internal_ca]
    static_configs:
      - targets:
          - https://tls-demo:8443/
        labels:
          site: lab
          service: tls-demo
    relabel_configs: *blackbox_relabel