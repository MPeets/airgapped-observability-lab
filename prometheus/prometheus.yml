global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    environment: lab

rule_files:
  - rules/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: alertmanager
    static_configs:
      - targets: ["alertmanager:9093"]

  - job_name: node
    static_configs:
      - targets: ["node-exporter:9100"]
        labels:
          site: lab
          role: docker-host

  # The exporter's own health. Probe jobs below only say if the TARGET answered.
  - job_name: blackbox-exporter
    static_configs:
      - targets: ["blackbox-exporter:9115"]

  - job_name: blackbox-http
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets:
          - http://prometheus:9090/-/healthy
          - http://alertmanager:9093/-/healthy
          - http://grafana:3000/api/health
        labels:
          site: lab
    relabel_configs: &blackbox_relabel
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115

  - job_name: blackbox-icmp
    metrics_path: /probe
    params:
      module: [icmp]
    static_configs:
      - targets: [node-exporter, grafana]
        labels:
          site: lab
          device_type: server
      # Uncomment to simulate an unreachable field device and watch ProbeFailed fire.
      # 192.0.2.10 is a reserved documentation address, so nothing ever answers.
      # - targets: [192.0.2.10]
      #   labels:
      #     site: lab
      #     device_type: plc
    relabel_configs: *blackbox_relabel