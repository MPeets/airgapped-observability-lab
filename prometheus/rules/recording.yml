# OS-agnostic host series. Linux (node_exporter) and Windows (windows_exporter)
# are normalised to the same names with an `os` label, so one set of alerts
# covers both.
groups:
  - name: host-recording-linux
    interval: 30s
    rules:
      - record: instance:cpu_utilisation:ratio
        expr: 1 - avg without (cpu, mode) (rate(node_cpu_seconds_total{mode="idle"}[5m]))
        labels:
          os: linux

      - record: instance:memory_utilisation:ratio
        expr: 1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)
        labels:
          os: linux

      - record: instance_mountpoint:filesystem_avail:bytes
        expr: node_filesystem_avail_bytes{fstype!~"tmpfs|overlay|squashfs"}
        labels:
          os: linux

      - record: instance_mountpoint:filesystem_avail:ratio
        expr: |
          node_filesystem_avail_bytes{fstype!~"tmpfs|overlay|squashfs"}
            / node_filesystem_size_bytes{fstype!~"tmpfs|overlay|squashfs"}
        labels:
          os: linux

  - name: host-recording-windows
    interval: 30s
    rules:
      - record: instance:cpu_utilisation:ratio
        expr: 1 - avg without (core, mode) (rate(windows_cpu_time_total{mode="idle"}[5m]))
        labels:
          os: windows

      - record: instance:memory_utilisation:ratio
        expr: 1 - (windows_memory_available_bytes / windows_memory_physical_total_bytes)
        labels:
          os: windows

      # Windows reports volumes ("C:"); copy them into `mountpoint` so the same
      # disk alerts and annotations work for both operating systems.
      - record: instance_mountpoint:filesystem_avail:bytes
        expr: |
          label_replace(
            windows_logical_disk_free_bytes{volume!~"HarddiskVolume.*"},
            "mountpoint", "$1", "volume", "(.+)"
          )
        labels:
          os: windows

      - record: instance_mountpoint:filesystem_avail:ratio
        expr: |
          label_replace(
            windows_logical_disk_free_bytes{volume!~"HarddiskVolume.*"}
              / windows_logical_disk_size_bytes{volume!~"HarddiskVolume.*"},
            "mountpoint", "$1", "volume", "(.+)"
          )
        labels:
          os: windows