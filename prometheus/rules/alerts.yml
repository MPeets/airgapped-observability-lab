groups:
  - name: meta
    rules:
      - alert: Watchdog
        expr: vector(1)
        labels:
          severity: none
        annotations:
          summary: Always firing. Proves the whole alerting pipeline is alive.
          description: >-
            If this alert stops arriving at the receiver, alerting itself is broken,
            even if everything else looks quiet.

  - name: availability
    rules:
      - alert: TargetDown
        # Probe jobs excluded: their up only means the blackbox exporter answered.
        # Probe results are covered by ProbeFailed instead.
        expr: up{job!~"blackbox-(http|icmp|tls)"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.job }} target {{ $labels.instance }} is down"
          description: "Prometheus has not been able to scrape {{ $labels.instance }} for more than 2 minutes."
          runbook: docs/runbook.md#targetdown

  - name: node
    rules:
      - alert: HostHighCpu
        expr: instance:node_cpu_utilisation:ratio > 0.9
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "High CPU on {{ $labels.instance }}"
          description: "CPU has been above 90% for 10 minutes (currently {{ $value | humanizePercentage }})."
          runbook: docs/runbook.md#hosthighcpu

      - alert: HostHighMemory
        expr: instance:node_memory_utilisation:ratio > 0.9
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "High memory usage on {{ $labels.instance }}"
          description: "Memory has been above 90% for 10 minutes (currently {{ $value | humanizePercentage }})."
          runbook: docs/runbook.md#hosthighmemory

      - alert: HostDiskWillFillIn24h
        expr: |
          instance_mountpoint:node_filesystem_avail:ratio < 0.2
          and
          predict_linear(node_filesystem_avail_bytes{fstype!~"tmpfs|overlay|squashfs"}[6h], 24 * 3600) < 0
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "Disk {{ $labels.mountpoint }} on {{ $labels.instance }} will fill within 24h"
          description: "Less than 20% free and the 6h trend says it runs out within a day."
          runbook: docs/runbook.md#hostdiskwillfillin24h

      - alert: HostDiskAlmostFull
        expr: instance_mountpoint:node_filesystem_avail:ratio < 0.05
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Disk {{ $labels.mountpoint }} on {{ $labels.instance }} is almost full"
          description: "Only {{ $value | humanizePercentage }} free."
          runbook: docs/runbook.md#hostdiskalmostfull

  - name: blackbox
    rules:
      - alert: ProbeFailed
        expr: probe_success == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.job }} probe to {{ $labels.instance }} is failing"
          description: "{{ $labels.instance }} has not answered the {{ $labels.job }} probe for 2 minutes."
          runbook: docs/runbook.md#probefailed

      - alert: ProbeSlow
        expr: avg_over_time(probe_duration_seconds[5m]) > 1
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.instance }} is answering slowly"
          description: "Average probe time over 5m is {{ $value | humanizeDuration }}."
          runbook: docs/runbook.md#probeslow

  - name: certificates
    rules:
      - alert: TLSCertExpiringSoon
        expr: (probe_ssl_earliest_cert_expiry - time()) / 86400 < 30
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Certificate for {{ $labels.instance }} expires in {{ printf \"%.0f\" $value }} days"
          description: "Renew it before the 7-day critical threshold. Check whether renewal for this service is automated."
          runbook: docs/runbook.md#tlscertexpiringsoon

      - alert: TLSCertExpiryCritical
        expr: (probe_ssl_earliest_cert_expiry - time()) / 86400 < 7
        for: 15m
        labels:
          severity: critical
        annotations:
          summary: "Certificate for {{ $labels.instance }} expires in {{ printf \"%.0f\" $value }} days"
          description: "Renew now. When it expires, clients that validate it will refuse to connect."
          runbook: docs/runbook.md#tlscertexpirycritical