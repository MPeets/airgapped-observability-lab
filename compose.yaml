name: observability-lab

# Applied to every service: read-only root filesystem (with a small in-memory
# /tmp for scratch files), no privilege escalation, no Linux capabilities, and
# bounded log files so containers can't fill the disk.
x-hardening: &hardening
  read_only: true
  tmpfs:
    - /tmp:size=64m
  security_opt:
    - no-new-privileges:true
  cap_drop: [ALL]
  restart: unless-stopped
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  prometheus:
    <<: *hardening
    image: prom/prometheus:${PROMETHEUS_VERSION:-v3.5.0}
    container_name: prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-15d}
      - --storage.tsdb.retention.size=${PROMETHEUS_RETENTION_SIZE:-5GB}
      - --web.enable-lifecycle
    volumes:
      - ./prometheus:/etc/prometheus:ro
      - prometheus-data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    mem_limit: 1g
    cpus: 1.0

  node-exporter:
    <<: *hardening
    image: prom/node-exporter:${NODE_EXPORTER_VERSION:-v1.9.1}
    container_name: node-exporter
    command:
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
      - --path.rootfs=/rootfs
      - --collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    mem_limit: 64m
    cpus: 0.25

  grafana:
    <<: *hardening
    image: grafana/grafana:${GRAFANA_VERSION:-12.1.0}
    container_name: grafana
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD in .env}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_SECURITY_COOKIE_SAMESITE: strict
      # Nothing should try to reach the internet in an air-gapped network
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
      GF_SECURITY_DISABLE_GRAVATAR: "true"
      GF_SNAPSHOTS_EXTERNAL_ENABLED: "false"
      GF_PLUGINS_PREINSTALL_DISABLED: "true"
      # Plugins arrive only through the reviewed offline bundle, never the UI
      GF_PLUGINS_PLUGIN_ADMIN_ENABLED: "false"
      GF_PUBLIC_DASHBOARDS_ENABLED: "false"
      # Logs to stdout only, so the read-only filesystem has nothing to write
      GF_LOG_MODE: console
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/etc/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - prometheus
    mem_limit: 512m
    cpus: 1.0

  alertmanager:
    <<: *hardening
    image: prom/alertmanager:${ALERTMANAGER_VERSION:-v0.28.1}
    container_name: alertmanager
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
      - --cluster.listen-address=
    volumes:
      - ./alertmanager:/etc/alertmanager:ro
      - alertmanager-data:/alertmanager
    ports:
      - "127.0.0.1:9093:9093"
    mem_limit: 128m
    cpus: 0.25

  webhook-logger:
    <<: *hardening
    image: python:${PYTHON_VERSION:-3.12.11-alpine3.22}
    container_name: webhook-logger
    user: "65534:65534"
    environment:
      PYTHONDONTWRITEBYTECODE: "1"
    command: ["python", "-u", "/app/server.py"]
    volumes:
      - ./tools/webhook-logger:/app:ro
    mem_limit: 64m
    cpus: 0.25

  blackbox-exporter:
    <<: *hardening
    image: prom/blackbox-exporter:${BLACKBOX_VERSION:-v0.27.0}
    container_name: blackbox-exporter
    command:
      - --config.file=/etc/blackbox_exporter/blackbox.yml
    volumes:
      - ./blackbox:/etc/blackbox_exporter:ro
      - ./certs/public:/etc/lab-ca:ro
    # The only capability anything in the stack gets: raw sockets for ICMP
    cap_add: [NET_RAW]
    mem_limit: 64m
    cpus: 0.25

  tls-demo:
    <<: *hardening
    image: python:${PYTHON_VERSION:-3.12.11-alpine3.22}
    container_name: tls-demo
    user: "65534:65534"
    environment:
      PYTHONDONTWRITEBYTECODE: "1"
    command: ["python", "-u", "/app/server.py"]
    volumes:
      - ./tools/tls-demo:/app:ro
      - ./certs/tls-demo:/certs:ro
    mem_limit: 64m
    cpus: 0.25

volumes:
  prometheus-data:
  grafana-data:
  alertmanager-data: