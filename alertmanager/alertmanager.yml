global:
  resolve_timeout: 5m

route:
  receiver: default
  group_by: [alertname, site, instance]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h

  routes:
    # Dead man's switch: keeps arriving every minute while alerting works.
    # In production this goes to a separate checker that alarms when it STOPS.
    - matchers: [alertname="Watchdog"]
      receiver: watchdog
      group_wait: 0s
      group_interval: 1m
      repeat_interval: 1m

    # Wakes someone up
    - matchers: [severity="critical"]
      receiver: oncall
      repeat_interval: 1h

    # Can wait until working hours
    - matchers: [severity="warning"]
      receiver: team
      repeat_interval: 12h

inhibit_rules:
  # A host that is down will trip other alerts too. Show only the root cause.
  - source_matchers: [alertname="TargetDown"]
    target_matchers: [alertname!="TargetDown"]
    equal: [instance]

  # If the disk is already almost full, the "will fill in 24h" warning is noise.
  - source_matchers: [alertname="HostDiskAlmostFull"]
    target_matchers: [alertname="HostDiskWillFillIn24h"]
    equal: [instance, mountpoint]

  # Critical certificate alert already covers the 30-day warning for the same endpoint.
  - source_matchers: [alertname="TLSCertExpiryCritical"]
    target_matchers: [alertname="TLSCertExpiringSoon"]
    equal: [instance]

receivers:
  - name: default
    webhook_configs:
      - url: http://webhook-logger:8080/default
        send_resolved: true

  - name: oncall
    webhook_configs:
      - url: http://webhook-logger:8080/oncall
        send_resolved: true

  - name: team
    webhook_configs:
      - url: http://webhook-logger:8080/team
        send_resolved: true

  - name: watchdog
    webhook_configs:
      - url: http://webhook-logger:8080/watchdog
        send_resolved: false