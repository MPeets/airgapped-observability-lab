name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Read-only token: CI never needs to write to the repository.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Throwaway value for CI only. Real installs set it in .env.
  GRAFANA_ADMIN_PASSWORD: ci-only-not-a-secret

jobs:
  validate:
    name: Validate config, rules and scripts
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      # Third-party actions pinned to a full commit SHA, not a movable tag.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Prepare .env
        run: cp .env.example .env

      - name: Lint shell scripts
        run: shellcheck scripts/*.sh

      - name: Check Python helpers compile
        run: python3 -m py_compile tools/webhook-logger/server.py tools/tls-demo/server.py

      - name: Check dashboards are valid JSON
        run: for f in grafana/dashboards/*.json; do python3 -m json.tool "$f" > /dev/null && echo "ok $f"; done

      - name: Prometheus, Alertmanager and blackbox checks + rule unit tests
        run: ./scripts/check.sh

  smoke:
    name: Run the full stack
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Prepare .env and lab certificates
        run: |
          cp .env.example .env
          ./scripts/gen-lab-certs.sh 90

      - name: Start stack
        run: docker compose up -d

      - name: Smoke test
        run: ./scripts/smoke-test.sh

      - name: Logs on failure
        if: failure()
        run: docker compose logs --no-color --tail 100

  offline-install:
    name: Offline bundle and air-gapped install
    needs: validate
    # Heavy (around 1.5 GB of images), so only on main and on demand.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build bundle
        run: ./scripts/bundle.sh

      - name: Simulate the air gap
        run: |
          # Remove every image so the bundle is the only source, then make the
          # common registries unresolvable so any pull attempt fails loudly.
          docker image prune -af
          for host in registry-1.docker.io index.docker.io docker.io quay.io ghcr.io; do
            echo "0.0.0.0 $host" | sudo tee -a /etc/hosts > /dev/null
          done
          if docker pull -q busybox:latest; then
            echo "Registry still reachable, air gap simulation failed"; exit 1
          fi
          echo "Registries unreachable, as on an air-gapped host"

      - name: Install from bundle
        run: |
          mkdir -p /tmp/airgap && cd /tmp/airgap
          cp "$GITHUB_WORKSPACE"/dist/observability-lab-*.tar* .
          sha256sum -c observability-lab-*.tar.sha256
          tar -xf observability-lab-*[0-9a-f].tar
          cd observability-lab-*/
          cp repo/.env.example repo/.env
          sed -i "s/^GRAFANA_ADMIN_PASSWORD=.*/GRAFANA_ADMIN_PASSWORD=$GRAFANA_ADMIN_PASSWORD/" repo/.env
          ./install.sh

      - name: Smoke test the offline install
        run: |
          cd /tmp/airgap/observability-lab-*/repo
          ./scripts/smoke-test.sh

      - name: Keep the bundle's checksums and image manifest
        if: always()
        run: |
          mkdir -p evidence
          tar -xOf dist/observability-lab-*[0-9a-f].tar --wildcards '*/SHA256SUMS' > evidence/SHA256SUMS || true
          tar -xOf dist/observability-lab-*[0-9a-f].tar --wildcards '*/images/manifest.txt' > evidence/image-manifest.txt || true
          cp dist/*.sha256 evidence/ || true

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: bundle-evidence
          path: evidence/